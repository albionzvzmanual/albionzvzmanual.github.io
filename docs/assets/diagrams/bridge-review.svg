<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc"><title id="title">Bridge crossing decision</title><desc id="desc">Friendly tail at bottom crosses a central bridge toward a first wave on the far bank. Enemies retreat upward. An unknown route joins from the right.</desc><rect width="420" height="500" fill="#f1f5f9"/><path d="M0 270H420M0 350H420" stroke="#456478" stroke-width="3"/><rect x="135" y="265" width="150" height="90" fill="#fff" stroke="#243b50" stroke-width="3"/><path d="M210 410V355M210 265V235M210 165V140M210 115V90" stroke="#243b50" stroke-width="3"/><path d="M390 205H280" stroke="#243b50" stroke-width="3" stroke-dasharray="8 6"/><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#142b3e"><rect x="90" y="25" width="240" height="65" rx="6" fill="#fff" stroke="#243b50"/><text x="210" y="65">E آ· retreating</text><rect x="75" y="165" width="240" height="70" rx="6" fill="#d8e8f4" stroke="#243b50"/><text x="195" y="208">F آ· first wave</text><text x="210" y="318">Bridge</text><rect x="80" y="410" width="260" height="65" rx="6" fill="#d8e8f4" stroke="#243b50"/><text x="210" y="451">F آ· tail crossing</text><text x="355" y="155">?</text><text x="210" y="130" font-size="20">Far bank</text><text x="210" y="390" font-size="20">Near bank</text></g></svg>