<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
  <title id="title">Bridge crossing decision</title>
  <desc id="desc">The friendly tail is on the near bank and bridge. The first wave is on the far bank. Enemies retreat forward. An unscouted route enters the far bank from the right.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#b3e6c9" stroke-opacity=".1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto-start-reverse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#d3e4da" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path fill="#202d26" d="M0 0h420v500H0z"/>
  <path fill="url(#grid)" d="M0 0h420v500H0z"/>
  <path fill="#172421" stroke="#809c90" d="M0 268h420v90H0z"/>
  <path d="M14 300h66m226 29h97M30 333h58m218-34h82" stroke="#49655b" stroke-width="2" stroke-linecap="round"/>
  <rect x="143" y="255" width="134" height="115" rx="5" fill="#34463d" stroke="#a9c4b4" stroke-width="2"/>
  <path d="M210 157v-32m0-67V34" stroke="#d3e4da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M210 435v-49m0-131v-20" stroke="#d3e4da" stroke-width="2.5"/>
  <path d="M289 198h91" stroke="#f2cc99" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#edf5ef">
    <rect x="111" y="61" width="198" height="51" rx="5" fill="#303b33" stroke="#cad9d0"/>
    <text x="210" y="94">E · retreating</text>
    <rect x="107" y="161" width="182" height="64" rx="5" fill="#b3e6c9"/>
    <text x="198" y="201" fill="#17251e">F · first wave</text>
    <text x="359" y="184" fill="#f2cc99">?</text>
    <text x="210" y="320">Bridge</text>
    <rect x="91" y="417" width="238" height="56" rx="5" fill="#b3e6c9"/>
    <text x="210" y="453" fill="#17251e">F · tail crossing</text>
    <text x="23" y="250" font-size="18" text-anchor="start">Far bank</text>
    <text x="23" y="389" font-size="18" text-anchor="start">Near bank</text>
  </g>
</svg>
