<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">B / Reposition</title>
  <desc id="desc">The target moves up and right. The damage role’s old position no longer has a useful target. The stopper is recovering near the shortcut. A covered route goes around the lower side of the wall, where a healer can reach the new damage position. Check the next corner before committing.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#b3e6c9" stroke-opacity=".08"/>
    </pattern>
    <pattern id="hazard" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v7" stroke="#f1aba2" stroke-opacity=".42" stroke-width="2"/>
    </pattern>
    <pattern id="stone" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v8" stroke="#81948a" stroke-opacity=".34" stroke-width="2"/>
    </pattern>
    <marker id="advance" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#b3e6c9"/>
    </marker>
    <marker id="return" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#b3e6c9" stroke-width="1.8"/>
    </marker>
  </defs>
  <style>
    text { font: 600 15px system-ui, sans-serif; fill: #eef3ef; }
    .heading { font-size: 21px; font-weight: 720; }
    .sub, .foot { font-size: 15.5px; fill: #b8cbc1; }
    .central { text-anchor: middle; dominant-baseline: central; }
    .map-label { paint-order: stroke; stroke: #171f1c; stroke-width: 3.5; stroke-linejoin: round; }
    .ally { fill: #22382e; stroke: #b3e6c9; stroke-width: 2; }
    .enemy { fill: #422b29; stroke: #f1aba2; stroke-width: 2; }
    .warning { fill: #332e21; stroke: #f2cc99; stroke-width: 1.8; }
    .warning-label { fill: #f2cc99; }
    .ghost { fill: #25312b; stroke: #b8cbc1; stroke-width: 2; stroke-dasharray: 3 3; }
    .path { fill: none; stroke: #b3e6c9; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#advance); }
    .return { fill: none; stroke: #b3e6c9; stroke-width: 2.3; stroke-linecap: round; stroke-dasharray: 6 5; marker-end: url(#return); }
    .cover { fill: #b3e6c916; stroke: #b3e6c9; stroke-width: 1.8; stroke-dasharray: 2 4; stroke-linecap: round; }
    .threat { fill: url(#hazard); stroke: #f1aba2; stroke-width: 1.5; }
    .terrain { fill: url(#stone) #34423a; stroke: #a2b3a9; stroke-width: 1.5; }
    .cue { fill: none; stroke: #f2cc99; stroke-width: 2; stroke-dasharray: 1 4; stroke-linecap: round; }
    .reach { fill: none; stroke: #eff5ef; stroke-width: 1.8; stroke-linecap: round; }
    .leader { fill: none; stroke: #b8cbc1; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="358" height="298" rx="10" fill="#171f1c" stroke="#637d6e" stroke-width="1.5"/>
  <rect x="12" y="59" width="336" height="200" rx="5" fill="#121916" stroke="#465c50"/>
  <rect x="13" y="60" width="334" height="198" rx="4" fill="url(#grid)"/>
  <text class="heading" x="15" y="27">B / Reposition</text>
  <text class="sub" x="15" y="49">Same wall · target and cover shift</text>
  <path class="cover" d="M104 180q19 34 84 32l25-1q3-56 36-81 21-11 47 13 21 22-1 61-24 48-92 46h-55q-56 0-44-70z"/>
    <rect class="terrain" x="163" y="120" width="62" height="82" rx="5"/>
    <text class="central map-label" x="194" y="161">Wall</text>
    <path d="M155 112h79" stroke="#81948a" stroke-width="1.6" stroke-dasharray="2 5"/>
    <path class="path" d="M130 109q-32 40-27 83t28 42h69q47 0 57-68"/>
    <path class="reach" d="m270 147 24-37"/>
    <circle cx="293" cy="112" r="3.5" fill="#eef3ef"/>
    <path class="cue" d="M147 111h63"/>
    <circle class="ghost" cx="130" cy="98" r="12"/><text class="central" x="130" y="98">D</text>
    <circle class="ally" cx="138" cy="154" r="12"/><text class="central" x="138" y="154">S</text><circle class="ally" cx="240" cy="199" r="12"/><text class="central" x="240" y="199">H</text><circle class="ally" cx="261" cy="153" r="12"/><text class="central" x="261" y="153">D</text>
    <rect class="enemy" x="289" y="88" width="22" height="22" rx="2"/><text class="central" x="300" y="99">E</text>
    <path class="warning" d="M200 88l11 11-11 11-11-11z"/><text class="central" x="200" y="99">?</text>
    <text class="map-label" x="22" y="91">Old spot</text>
    <text class="map-label" x="20" y="148">S recovering</text>
    <text class="map-label warning-label" x="219" y="87">Check shortcut</text>
    <text class="map-label" x="114" y="226">Covered walk</text>
  <text class="foot" x="15" y="284">D damage · S stopper · H healer · E enemy</text>
</svg>
