site_name: Albion ZvZ Manual
site_description: The Field Manual for Large-Scale Albion Warfare
site_author: Albion ZvZ Manual Project
site_url: https://albionzvzmanual.github.io/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
extra_css:
  - assets/stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
nav:
  - Home: index.md
  - Start Here:
      - Overview: start-here/index.md
      - New to ZvZ: start-here/new-to-zvz.md
      - Ten Rules Before CTA: start-here/ten-rules-before-cta.md
