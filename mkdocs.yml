site_name: Albion ZvZ Manual
site_description: The Field Manual for Large-Scale Albion Warfare
site_author: Albion ZvZ Manual Project
site_url: https://albionzvzmanual.github.io/
theme:
  name: material
  features:
  - navigation.indexes
  - navigation.tabs
  - navigation.top
  - search.suggest
  - search.highlight
  - toc.follow
  - navigation.footer
  palette:
    scheme: fieldbook
  font: false
  custom_dir: overrides
  logo: assets/field-mark.svg
  favicon: assets/field-mark.svg
extra_css:
- assets/stylesheets/fieldbook.css
- assets/stylesheets/tactical-illustrations.css
markdown_extensions:
- admonition
- tables
- toc:
    permalink: true
- pymdownx.superfences
- pymdownx.details
- attr_list
